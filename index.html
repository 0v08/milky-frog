<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#080e18" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="奶蛙远征" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="description" content="奶蛙远征 · 卡牌构筑肉鸽，手机电脑都能玩，自动本地存档。" />
<title>奶蛙远征 · 卡牌肉鸽</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:#e9f1ff;
  background:
    radial-gradient(900px 520px at 50% -8%, #16324a 0%, rgba(22,50,74,0) 62%),
    radial-gradient(760px 520px at 108% 104%, #173b2c 0%, rgba(23,59,44,0) 60%),
    #070d16;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bwrap{display:flex;flex-direction:column;flex:1;min-height:0}
.bleft{display:flex;flex-direction:column;flex:1;min-height:0}
.bright{display:flex;flex-direction:column;flex:none;min-height:0}
.screen{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.26;pointer-events:none}
.bgimg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(7,13,22,.58) 0%,rgba(7,13,22,.8) 55%,rgba(7,13,22,.95) 100%)}
.screen>.screenbody{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.grow{flex:1}
.muted{color:#8ea3c0}
.small{font-size:12px}
.center{text-align:center}
h1.title{font-size:30px;line-height:1.2;margin:0;font-weight:900;letter-spacing:1px;
  background:linear-gradient(180deg,#d8ffe4,#7bd88f 60%,#3f9d63);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 18px rgba(123,216,143,.25))}
.sub{color:#8ea3c0;font-size:13px;line-height:1.7;margin:10px 0 0}
.btn{appearance:none;border:1px solid rgba(255,255,255,.14);background:linear-gradient(180deg,#1d2b40,#141d2b);
  color:#e9f1ff;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;
  transition:transform .1s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#2f8f5b,#1e6b41);border-color:rgba(87,192,138,.45);color:#eafff3;
  box-shadow:0 8px 22px rgba(47,143,91,.25)}
.btn.gold{background:linear-gradient(180deg,#4a3a12,#2d230b);border-color:rgba(245,196,81,.45);color:#ffe9ad}
.btn:disabled{opacity:.38;filter:grayscale(.6)}
.btn.wide{width:100%}
.row{display:flex;align-items:center;gap:10px}
.bar{height:9px;border-radius:999px;background:#0d1725;border:1px solid rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .25s}
.topbar{display:flex;align-items:center;gap:8px;font-size:12px;color:#9fb3cf;margin-bottom:8px}
.chip{background:#0e1a2a;border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:4px 9px;font-size:11px;color:#b7c8de}
/* 常驻 HUD */
.hud{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px 7px;
  background:linear-gradient(180deg,rgba(10,17,28,.96),rgba(10,17,28,.72));
  border-bottom:1px solid rgba(255,255,255,.07);backdrop-filter:blur(6px)}
.pathchip{flex:none;font-size:11px;font-weight:800;padding:5px 9px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.paths{display:flex;flex-direction:column;gap:9px;overflow-y:auto;flex:1;padding:2px 0 8px}
.pathcard{appearance:none;font:inherit;text-align:left;color:#e9f1ff;cursor:pointer;
  background:linear-gradient(135deg,rgba(24,36,56,.94),rgba(13,20,32,.94));
  border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--pc);border-radius:14px;
  padding:10px 12px;transition:transform .1s,border-color .15s}
.pathcard:active{transform:scale(.985)}
.pathcard:hover{border-color:var(--pc)}
.pchead{display:flex;align-items:center;gap:7px}
.pce{font-size:19px}
.pcn{font-size:14px;font-weight:900;color:var(--pc)}
.pcdot{margin-left:auto;font-size:10px;font-weight:800;color:#0d1522;background:var(--pc);
  border-radius:6px;padding:2px 6px}
.pctag{font-size:11px;color:#9fb4cf;margin-top:3px}
.pcdesc{font-size:11px;color:#8ea3c0;line-height:1.45;margin-top:4px}
.pcrelic{font-size:10.5px;color:#d9c7ff;margin-top:6px;background:rgba(160,120,255,.12);
  border-radius:7px;padding:4px 7px}
.phase2{font-size:9px;font-weight:800;color:#0d1522;background:#ffb347;border-radius:5px;
  padding:1px 5px;margin-left:6px;vertical-align:2px}
.hudgold{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:800;color:#ffdf9c;
  background:rgba(74,58,18,.5);border:1px solid rgba(245,196,81,.35);border-radius:999px;padding:4px 10px}
.hudrelics{flex:1;min-width:0;display:flex;gap:5px;overflow-x:auto;padding:1px 6px 1px 0;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 90%,rgba(0,0,0,0));mask-image:linear-gradient(90deg,#000 90%,rgba(0,0,0,0))}
.hudrelics::-webkit-scrollbar{display:none}
.rchip{appearance:none;flex:none;font:inherit;font-size:11px;font-weight:700;line-height:1.2;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;color:#d6e6fb;white-space:nowrap;
  background:#101b2a;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:5px 9px 5px 7px;
  transition:transform .1s,background .15s}
.rchip .re{font-size:14px}
.rchip:hover{background:#16243a}
.rchip:active{transform:scale(.9)}
.rnone{font-size:11px;color:#5d6f88;display:flex;align-items:center}
/* 遗物详情弹层 */
.modal{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(3,7,12,.72);backdrop-filter:blur(3px);animation:fade .16s ease-out}
.mcard{width:100%;max-width:296px;text-align:center;padding:20px 18px;
  background:linear-gradient(180deg,#1d2d46,#101a29);border:1px solid rgba(120,170,255,.22);
  border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.65)}
.mcard .e{font-size:44px;line-height:1}
.mcard .mn{font-size:18px;font-weight:900;margin-top:10px;color:#ffe9ad}
.mcard .md{font-size:13px;line-height:1.6;color:#b9cbe6;margin-top:8px}
.mcard .mtip{font-size:10px;color:#6f84a0;margin-top:10px;letter-spacing:1px}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* ---------- 战斗 ---------- */
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hpwrap{flex:1;min-width:0}
.hpline{display:flex;justify-content:space-between;font-size:11px;color:#a7b9d1;margin-bottom:4px}
.hp>i{background:linear-gradient(90deg,#ff6b6b,#ffa06b)}
.energy{font-size:13px;font-weight:800;color:#a9f0bd;background:#0e1a2a;border:1px solid rgba(123,216,143,.3);
  border-radius:999px;padding:6px 11px;white-space:nowrap}
.relics{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;min-height:22px}
.relic{font-size:13px;background:#101b2a;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:2px 7px;cursor:help}
.arena{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;overflow:hidden;position:relative}
.enemy{width:100%;max-width:330px;background:linear-gradient(180deg,rgba(31,45,68,.86),rgba(15,23,36,.9));
  border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:9px 13px;text-align:center;position:relative;
  box-shadow:0 16px 40px rgba(0,0,0,.45)}
.enemy.hit{animation:shake .22s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.enemy .face{font-size:52px;line-height:1.15;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.enemy .enm{font-weight:800;font-size:14px;margin-bottom:6px}
.ehp>i{background:linear-gradient(90deg,#ff5d5d,#ff8f5d)}
.enums{font-size:10.5px;color:#9fb3cf;margin:4px 0 8px}
.intent{display:inline-flex;align-items:center;gap:6px;background:#0b1422;border:1px solid rgba(255,255,255,.12);
  border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:800;color:#ffd9a8}
.statuses{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:8px;min-height:18px}
.st{font-size:10.5px;background:#0c1626;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:2px 6px;color:#c8d7ea}
.st.bad{border-color:rgba(255,107,107,.35);color:#ffb3b3}
.st.good{border-color:rgba(123,216,143,.35);color:#a9f0bd}
.shield{font-size:13px;font-weight:800;color:#9cc8ff;background:#0e1a2a;border:1px solid rgba(107,178,255,.35);
  border-radius:999px;padding:5px 12px}
.me{position:relative;font-size:46px;line-height:1;filter:drop-shadow(0 12px 20px rgba(0,0,0,.55));margin-top:-2px}
.art{display:block;margin:0 auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));-webkit-user-drag:none}
.art.hero{height:196px;width:auto}.art.mid{height:104px;width:auto}.art.small{height:70px;width:auto}
.enemy .face img{height:clamp(62px,10.5vh,104px);width:auto;max-width:100%;object-fit:contain;display:block;margin:0 auto;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.55))}
.enemy.boss .face img{height:clamp(76px,14vh,148px)}
.me img{height:clamp(58px,10vh,100px);width:auto;object-fit:contain;display:block;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.5))}
.keeper{display:flex;align-items:center;gap:10px;background:rgba(31,45,68,.55);border:1px solid rgba(120,170,255,.14);border-radius:14px;padding:8px 12px;margin:8px 0}
.keeper img{height:50px;width:auto;flex:none}
.keeper div{font-size:12px;color:#b9cbe6;line-height:1.4}
.me .blk{position:absolute;right:-30px;bottom:-2px;top:auto;font-size:12px;font-weight:900;color:#9cc8ff;background:#0e1a2a;
  border:1px solid rgba(107,178,255,.4);border-radius:999px;padding:3px 9px;white-space:nowrap}
.pstatus{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:20px;margin-bottom:2px}
.hand{display:flex;flex:none;gap:8px;overflow-x:auto;padding:10px 12px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.hand::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 auto;width:96px;height:146px;border-radius:14px;padding:9px 8px 6px;
  display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:#e9f1ff;cursor:pointer;
  scroll-snap-align:center;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,#1c2a3e,#121a28);
  box-shadow:0 8px 18px rgba(0,0,0,.45);transition:transform .12s,box-shadow .12s,opacity .15s}
.card:active{transform:translateY(-10px) scale(1.05);box-shadow:0 16px 28px rgba(0,0,0,.55)}
.card .cost{position:absolute;top:-7px;left:-7px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:900;background:#0b1422;border:1px solid #7bd88f;color:#a9f0bd;box-shadow:0 0 0 3px #070d16}
.card .nm{font-size:12px;font-weight:800;padding-left:10px}
.card .em{font-size:23px;text-align:center;margin:1px 0 2px}
.card .ds{font-size:10px;line-height:1.28;color:#b9c8dd;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.card.attack{border-color:rgba(255,107,107,.4);background:linear-gradient(180deg,#2a1a24,#191219)}
.card.skill{border-color:rgba(107,178,255,.4);background:linear-gradient(180deg,#182636,#111a26)}
.card.power{border-color:rgba(185,139,255,.4);background:linear-gradient(180deg,#231a33,#161122)}
.card.disabled{opacity:.42;filter:grayscale(.55)}
.bfoot{display:flex;align-items:center;gap:10px}
.pile{font-size:11px;color:#8ea3c0;white-space:nowrap}
.bfoot .btn{flex:1}
/* ---------- 地图 ---------- */
.maplist{flex:1;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:10px;padding:6px 2px 16px}
.mrow{display:flex;gap:10px;justify-content:center;position:relative}
.mrow.done{opacity:.35}
.mrow.cur .node{box-shadow:0 0 0 2px rgba(123,216,143,.55),0 10px 24px rgba(123,216,143,.15)}
.node{flex:1;max-width:150px;appearance:none;font:inherit;color:#e9f1ff;cursor:default;
  border:1px dashed rgba(255,255,255,.12);background:rgba(13,20,32,.78);border-radius:14px;padding:10px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.6}
.node.avail{opacity:1;cursor:pointer;border-style:solid;border-color:rgba(255,255,255,.18);
  background:linear-gradient(180deg,#1c2b40,#131c2a)}
.node.avail:active{transform:scale(.96)}
.node .ni{font-size:20px}
.node .nl{font-size:11px;font-weight:700;color:#b7c8de}
.node.battle .ni{color:#ffb3b3}
.node.elite{border-color:rgba(255,107,107,.4)}
.node.boss{border-color:rgba(245,196,81,.5);background:linear-gradient(180deg,#2a2010,#1a1408)}
/* ---------- 通用面板 ---------- */
.panel{background:linear-gradient(180deg,rgba(28,42,64,.92),rgba(15,23,36,.92));
  border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;overflow-y:auto;flex:1;padding:4px 0;align-content:start;align-items:start}
.minicard{appearance:none;font:inherit;color:#e9f1ff;text-align:left;cursor:pointer;min-height:64px;
  border:1px solid rgba(255,255,255,.13);border-radius:11px;padding:7px;background:linear-gradient(180deg,#1b283b,#121a27);
  display:flex;flex-direction:column;gap:2px}
.minicard .nm{font-size:11.5px;font-weight:800}
.minicard .ds{font-size:10px;color:#b9c8dd;line-height:1.3}
.minicard.qty{position:relative}
.badge{position:absolute;top:5px;right:6px;font-size:10px;background:#0b1422;border-radius:6px;padding:0 4px;color:#a9f0bd}
.items{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;padding:2px 0}
.item{display:flex;align-items:center;gap:10px;background:rgba(11,17,27,.94);border:1px solid rgba(255,255,255,.08);
  border-radius:13px;padding:10px 12px}
.item .ic{font-size:20px}
.item .tx{flex:1;min-width:0;display:block;text-align:left}
.item .t1{display:block;font-size:12.5px;font-weight:800;margin-bottom:2px;color:#f0f6ff}
.item .t2{display:block;font-size:10.5px;color:#9db0c9;line-height:1.35}
.price{font-size:11px;font-weight:800;color:#ffe9ad;white-space:nowrap}
/* ---------- 特效 ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:absolute;font-weight:900;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.8);
  animation:floatup .75s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  25%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#0e1a2aee;
  border:1px solid rgba(123,216,143,.35);color:#d9ffe6;padding:8px 16px;border-radius:999px;font-size:12.5px;
  font-weight:700;z-index:60;animation:toastin .25s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ================= 双端 / 横竖屏适配 ================= */
.titleScreen{justify-content:center;align-items:center}
.titleScreen .art.hero{margin-bottom:10px}
.titlewrap{display:flex;flex-direction:column;gap:16px;width:100%;max-width:520px;margin:0 auto}
@media (min-height:820px){.titlewrap{gap:20px}}
@media (min-width:640px){
  body{background-image:
    radial-gradient(900px 520px at 50% -8%,#16324a 0%,rgba(22,50,74,0) 62%),
    radial-gradient(760px 520px at 108% 104%,#173b2c 0%,rgba(23,59,44,0) 60%)}
  #app{width:100%;max-width:660px;border-radius:26px;box-shadow:0 32px 90px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.06);
    height:min(100dvh,900px);margin:auto}
  body{display:flex;align-items:center;justify-content:center}
  body::before{content:'';position:fixed;inset:0;z-index:-1;background:url(art/bg/cover.webp) center/cover no-repeat;
    filter:blur(26px) saturate(1.1) brightness(.5);transform:scale(1.12)}
  .screen{padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
  h1.title{font-size:36px}
  .card{width:112px;height:178px}
  .card .nm{font-size:12.5px}
  .card .em{font-size:24px;margin:0 0 1px}
  .card .ds{font-size:10px;line-height:1.25;-webkit-line-clamp:6}
  .node{max-width:190px;padding:12px 8px}
  .node .ni{font-size:24px}
  .node .nl{font-size:12.5px}
  .item{padding:12px 14px}
  .item .t1{font-size:13.5px}
  .item .t2{font-size:11.5px}
  .pathcard{padding:13px 15px}
  .enemy .face img{height:clamp(90px,15vh,150px)}
  .enemy.boss .face img{height:clamp(104px,19vh,196px)}
  .me img{height:clamp(84px,14vh,142px)}
  .art.hero{height:230px}
  .btn{padding:13px 18px;font-size:15px}
  .hand{gap:10px}
  .deckgrid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .minicard{min-height:74px}
  .hud{padding:10px 18px 9px}
  .rchip{font-size:12px}
}

/* 桌面：战斗改左右两栏，左舞台右操作 */
@media (min-width:900px){
  #app{width:100%;max-width:1060px;height:min(100dvh,860px)}
  .screen{padding:20px 22px calc(20px + env(safe-area-inset-bottom))}
  .bwrap{flex-direction:row;gap:22px}
  .bleft{flex:1.05;gap:2px}
  .bright{flex:0 0 46%;max-width:520px;justify-content:flex-end;gap:8px}
  .bright .hand{flex-wrap:wrap;justify-content:center;align-items:flex-start;align-content:flex-start;overflow-y:auto;padding:6px 0 8px;max-height:62vh;flex:0 1 auto}
  .bright .bfoot{justify-content:space-between}
  .arena{justify-content:center}
  .enemy{max-width:400px}
  .enemy .face img{height:clamp(120px,22vh,210px)}
  .enemy.boss .face img{height:clamp(140px,26vh,250px)}
  .me img{height:clamp(110px,18vh,170px)}
  .hand{gap:10px}
  .card{width:118px;height:188px}
  /* 地图/商店在宽屏用两列，别挤成一条线 */
  .maplist{max-width:540px;margin:0 auto;width:100%;gap:6px}
  .maprow{gap:8px}
  .node{padding:6px 8px;max-width:170px;border-radius:14px}
  .node .ni{font-size:18px;margin-bottom:1px}
  .node .nl{font-size:11.5px}
  .items{max-width:820px;margin:0 auto;width:100%}
  .keeper{max-width:820px;margin:0 auto;width:100%}
  .titlewrap{max-width:600px;gap:20px}
  .titleScreen .art.hero{height:330px}
  .titleScreen h1.title{font-size:44px}
  .paths{max-width:820px;margin:0 auto;width:100%;padding:4px 0 10px}
  .pathcard{padding:15px 18px}
  .hud{padding:11px 22px 10px}
  .deckgrid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr));max-width:980px;margin:0 auto;width:100%}

function readSave(){
  try{
    var s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if(!s || s.v !== 1 || !s.run || !s.run.deck) return null;
    return s;
  }catch(e){ return null; }
}
function writeSave(){
  if(SIM || !G.run) return;
  if(G.screen === 'win' || G.screen === 'over'){ clearSave(); return; }

    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v:1, screen:G.screen, ts:Date.now(),
      run:G.run, b:G.b, shop:G.shop, reward:G.reward, ev:G.ev, rv:G.rv
    }));

}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

  if(G.screen === 'battle' && !G.b) G.screen = 'map';
  if(G.screen === 'reward' && !G.reward) G.screen = 'map';
  if(G.screen === 'shop' && !G.shop) G.screen = 'map';
}
function readStats(){
  try{ return JSON.parse(localStorage.getItem(STAT_KEY) || 'null') || {runs:0, wins:0, best:0}; }
  catch(e){ return {runs:0, wins:0, best:0}; }
}
function bumpStats(extra){
  var s = readStats();
  if(extra.runs) s.runs += extra.runs;
  if(extra.wins) s.wins += extra.wins;
  if(extra.row && extra.row > (s.best||0)) s.best = extra.row;
  try{ localStorage.setItem(STAT_KEY, JSON.stringify(s)); }catch(e){}
}

function hasRelic(id){ return G.run.relics.indexOf(id) >= 0; }

/* ================= 战斗核心 ================= */
function calcDmg(base, src, tgt){
  var d = base + (src.strength||0);
  if(src.weak > 0) d = Math.floor(d*0.75);
  if(tgt.vuln > 0) d = Math.floor(d*1.5);
  return Math.max(0, d);
}
function hit(t, d){
  var b = t.block||0, ab = Math.min(b, d);
  t.block = b - ab;
  t.hp -= (d - ab);
  return d - ab;
}
function atk(n, hits){
  hits = hits || 1;
  var b = G.b; if(!b || b.state !== 'player') return;
  var bonus = hasRelic('whetstone') ? 1 : 0;
  for(var i=0;i<hits;i++){
    if(b.enemy.hp <= 0) break;
    var d = calcDmg(n+bonus, b.player, b.enemy);
    var real = hit(b.enemy, d);
    if(!SIM) floatText('-'+real, '#ff8a8a', '#enemy');
  }
  shakeEnemy();
}
function blk(n){
  var b=G.b; if(!b) return;
  var gain = n + (hasRelic('shieldbit') ? 2 : 0);
  b.player.block += gain;
  if(G.run && G.run.stats) G.run.stats.blockGain += gain;
  if(b.player.blockToDmg > 0){
    b.player.blockAcc = (b.player.blockAcc||0) + gain;
    while(b.player.blockAcc >= 5 && b.enemy.hp > 0){
      b.player.blockAcc -= 5;
      b.enemy.hp -= b.player.blockToDmg;
      if(!SIM) floatText('-'+b.player.blockToDmg, '#ff8a8a', '#enemy');
    }
  }
}
function hpLoss(n){
  var b=G.b; if(!b || b.state !== 'player') return;
  var p=b.player;
  p.hp -= n;
  if(G.run && G.run.stats) G.run.stats.hpLost += n;
  if(!SIM) floatText('-'+n, '#ff9ecb', '.hpwrap');
  if(p.bloodRage > 0 && b.enemy.hp > 0){
    var d = n * p.bloodRage;
    b.enemy.hp -= d;
    if(!SIM) floatText('-'+d, '#ff8a8a', '#enemy');
  }
  if(p.hp <= 0) checkEnd();
}
function eStatus(k,v){
  var b=G.b; if(!b) return;
  var add = v + (k==='poison' && hasRelic('venom') ? 2 : 0);
  if(k === 'poison' && G.run && G.run.stats) G.run.stats.poison += add;
  var nv = (b.enemy[k]||0) + add;
  if(k === 'poison') nv = Math.min(25, nv);
  b.enemy[k] = nv;
}
function pStatus(k,v){
  var b=G.b; if(!b) return;
  b.player[k] = (b.player[k]||0) + v;
}
function healPlayer(n){
  var p=G.b.player;
  var before = p.hp;
  p.hp = Math.min(p.maxHp, p.hp + n);
  if(!SIM) floatText('+'+(p.hp-before), '#9ef07a');
}
function drawCards(n){
  var b=G.b;
  var limit = 10 + (b.player && b.player.handCap ? b.player.handCap : 0);
  for(var k=0;k<n;k++){
    if(b.hand.length >= limit) break;
    if(!b.draw.length){
      if(!b.discard.length) break;
      b.draw = shuffle(b.discard.slice()); b.discard = [];
      if(b.player && b.player.perDrawShuffle > 0){ b.player.block += b.player.perDrawShuffle; }
    }
    b.hand.push(b.draw.pop());
    if(G.run && G.run.stats) G.run.stats.draws++;
    onDraw();
  }
}
function onDraw(){
  var b=G.b;
  if(!b || b.state !== 'player') return;
  var p = b.player;
  if(p.perDraw > 0 && b.enemy.hp > 0){
    b.enemy.hp -= p.perDraw;
    if(!SIM) floatText('-'+p.perDraw, '#ff8a8a', '#enemy');
  }
  if(p.perDrawBlock > 0){ p.block += p.perDrawBlock; }
}
function checkEnd(){
  var b=G.b; if(!b) return true;
  if(b.state !== 'player' && b.state !== 'enemy') return true;
  if(b.enemy.hp <= 0){ b.state='won'; onWin(); return true; }
  if(b.player.hp <= 0){ b.state='lost'; onLose(); return true; }
  return false;
}
function onWin(){
  var b=G.b;
  G.run.hp = Math.max(1, b.player.hp);
  if(hasRelic('tear')) G.run.hp = Math.min(G.run.maxHp, G.run.hp + 5);
  G.run.gold += b.gold;
  G.reward = { gold: b.gold, cards: rollReward() };
  if(!SIM){
    G.screen = (b.row === 8) ? 'win' : 'reward';
    if(b.row === 8){
      bumpStats({wins:1, row:9});
      clearSave();
    } else {
      bumpStats({row: b.row + 1});
    }
  }
}
function onLose(){
  if(!SIM){ bumpStats({row: (G.run.row||0) + 1}); clearSave(); }
  G.run.hp = 0;
  if(!SIM) G.screen = 'over';
}
function startPlayerTurn(){
  var b=G.b, p=b.player;
  b.state = 'player';
  b.turn++;
  b.playedThisTurn = 0;
  p.block = p.keepBlock ? Math.floor(p.block * p.keepBlock / 100) : 0;
  if(p.poison > 0){
    var d = p.poison;
    p.hp -= d; p.poison--;
    if(!SIM) floatText('-'+d, '#9ef07a', '.hpwrap');
  }
  if(p.frogGod) p.strength += p.frogGod;
  if(p.bloodPact && p.hp < p.maxHp * 0.5) p.strength += 3;
  if(p.shieldGen) p.block += p.shieldGen;
  if(p.hp <= 0){ b.state='lost'; onLose(); return; }
  if(p.poisonAmp > 0 && b.enemy.hp > 0){
    b.enemy.poison = Math.min(25, (b.enemy.poison||0) + p.poisonAmp);
  }
  b.energy = b.maxEnergy;
  var extra = (hasRelic('bag') && b.turn === 1) ? 2 : 0;
  drawCards(5 + extra + (p.extraDraw||0));
}
function checkPhase(){
  var b=G.b; if(!b) return;
  var e=b.enemy;
  if(e.phase2Done || !e.phase2art) return;
  if(e.hp > e.maxHp*0.5) return;
  e.phase2Done = true;
  e.art = e.phase2art;
  if(e.phase2pat) { e.pat = e.phase2pat; e.pi = 0; }
  e.strength += (e.phase2Str || 2);
  if(!SIM){ toast(e.name + ' 进入第二阶段！'); }
}
function enemyTurn(){
  var b=G.b, e=b.enemy, p=b.player;
  if(e.poison > 0){
    var pd = e.poison;
    e.hp -= pd; e.poison = Math.max(0, e.poison - 2);
    if(!SIM) floatText('-'+pd, '#9ef07a', '#enemy');
    if(e.hp <= 0){ checkEnd(); return; }
  }
  var it = e.pat[e.pi % e.pat.length];
  e.pi++;
  if(it.k === 'atk'){
    var hits = it.hits || 1;
    for(var i=0;i<hits;i++){
      if(p.hp <= 0) break;
      var d = calcDmg(Math.round(it.v * e.dmgScale), e, p);
      var real = hit(p, d);
      if(!SIM) floatText('-'+real, '#ff6b6b', '.hpwrap');
      if(real > 0 && p.painStr > 0) p.strength += p.painStr;
      if(p.thorns > 0 && e.hp > 0){
        e.hp -= p.thorns;
        if(!SIM) floatText('-'+p.thorns, '#c9a6ff', '#enemy');
      }
    }
  } else if(it.k === 'blk'){
    e.block += Math.round(it.v * e.dmgScale);
  } else if(it.k === 'buff'){
    e.strength += it.v;
  } else if(it.k === 'weak'){
    p.weak += it.v;
  } else if(it.k === 'poison'){
    p.poison += it.v;
  }
  if(e.weak > 0) e.weak--;
  if(e.vuln > 0) e.vuln--;
  if(e.hp <= 0){ checkEnd(); return; }
  if(p.hp <= 0){ checkEnd(); return; }
  checkPhase();
  startPlayerTurn();
}
function endPlayerTurn(){
  var b=G.b;
  if(!b || b.state !== 'player') return;
  var p=b.player;
  if(p.regen > 0) healPlayer(p.regen);
  b.discard = b.discard.concat(b.hand);
  b.hand = [];
  if(p.weak > 0) p.weak--;
  if(p.vuln > 0) p.vuln--;
  b.state = 'enemy';
  enemyTurn();
  if(b.state === 'player') b.state = 'player';
}
function playCard(i){
  var b=G.b;
  if(!b || b.state !== 'player' || SIM && false) return;
  var id = b.hand[i];
  if(!id) return;
  var c = CARDS[id];
  if(!c || c.cost > b.energy) return;
  b.energy -= c.cost;
  b.hand.splice(i,1);
  if(c.exhaust){ if(!b.exhaust) b.exhaust = []; b.exhaust.push(id); }
  else { b.discard.push(id); }
  b.playedThisTurn = (b.playedThisTurn||0) + 1;
  c.play();
  checkPhase();
  if(b.state === 'player' || b.state === 'enemy') checkEnd();
  if(!SIM) render();
}

/* ================= 遭遇 ================= */
function chooseEnemy(role, row){
  if(role === 'boss') return POOL_BOSS[(G.run.bossIdx||0) % POOL_BOSS.length];
  if(role === 'elite') return pick(POOL_ELITE);
  return pick(row < 4 ? POOL_A : POOL_B);
}
function startBattle(role, row){
  var t = chooseEnemy(role, row);
  var isBoss = role === 'boss';
  var hp = isBoss ? t.hp : Math.round(t.hp * (1 + row*0.05));
  var e = {name:t.name, emoji:t.emoji, art:t.art, phase2art:t.phase2art, phase2pat:t.phase2pat,
           phase2Str:t.phase2Str, phase2Done:false,
           hp:hp, maxHp:hp, block:0, strength:0, weak:0, vuln:0, poison:0,
           pat:t.pat, pi:0, dmgScale: isBoss ? 1.22 : (1 + row*0.025)};
  var p = {hp:G.run.hp, maxHp:G.run.maxHp, block:0, strength:0, weak:0, vuln:0, poison:0,
           regen:0, shieldGen:0, thorns:0, frogGod:0,
           perDraw:0, perDrawBlock:0, perDrawShuffle:0, extraDraw:0, handCap:0,
           bloodRage:0, painStr:0, keepBlock:0, blockToDmg:0, blockAcc:0, poisonAmp:0, bloodPact:0};
  if(hasRelic('fountain')){ p.extraDraw = 4; }
  if(hasRelic('bloodpact')){
    p.bloodRage = 2; p.bloodPact = 1;
    p.hp = Math.min(p.maxHp, p.hp + 6);
  }
  if(hasRelic('ironplate')) p.keepBlock = 50;
  if(hasRelic('poisonjar')) p.poisonAmp = 4;
  G.b = {enemy:e, player:p, energy:0, maxEnergy: hasRelic('core') ? 4 : 3,
         draw:shuffle(G.run.deck.slice()), hand:[], discard:[], turn:0,
         state:'player', role:role, row:row,
         gold: isBoss ? 120 : (role==='elite' ? 38 + ri(9) : 14 + ri(9) + row*2)};
  if(hasRelic('courage')) p.block += 8;
  startPlayerTurn();
}
function rollReward(){
  var pool = [];
  for(var k in CARDS){ if(CARDS[k].rarity !== 'basic') pool.push(k); }
  var out = [], guard = 0;
  if(G.run && G.run.path){
    var mine = pool.filter(function(x){ return CARDS[x].path === G.run.path; });
    var want = 1 + (rnd() < 0.45 ? 1 : 0);
    while(want-- > 0 && mine.length){
      var c = pick(mine); mine.splice(mine.indexOf(c),1); out.push(c);
    }
  }
  while(out.length < 3 && guard++ < 200){
    var r = rnd(), want = r < 0.22 ? 'rare' : (r < 0.7 ? 'uncommon' : 'common');
    var cands = pool.filter(function(k){ return CARDS[k].rarity === want && out.indexOf(k) < 0; });
    if(!cands.length) continue;
    out.push(pick(cands));
  }
  return out;
}
function randomRelic(){
  var all = Object.keys(RELICS).filter(function(k){ return G.run.relics.indexOf(k) < 0; });
  if(!all.length) return null;
  return pick(all);
}
function addRelic(id){
  if(!id) return;
  G.run.relics.push(id);
  if(id === 'heart'){ G.run.maxHp += 15; G.run.hp += 15; }
}

/* ================= 一局 ================= */
function newRun(seed){
  srand(seed === undefined ? (Date.now() & 0x7fffffff) : seed);
  G.run = {hp:80, maxHp:80, gold:99, deck:[], relics:[], row:0, map:genMap(),
           path:null, bossIdx: ri(POOL_BOSS.length),
           stats:{draws:0, hpLost:0, blockGain:0, poison:0}};
  for(var i=0;i<5;i++) G.run.deck.push('strike');
  for(var j=0;j<4;j++) G.run.deck.push('defend');
  G.run.deck.push('hop');
  addRelic(pick(['courage','whetstone','shieldbit','bag']));
  G.b = null; G.reward = null; G.shop = null; G.ev = null; G.rv = null;
  G.screen = 'map';
}
function genMap(){
  var plan = [
    ['battle','battle'],
    ['battle','event'],
    ['elite','battle'],
    ['rest','shop'],
    ['battle','event'],
    ['elite','battle'],
    ['shop','rest'],
    ['battle','battle'],
    ['boss']
  ];
  return plan.map(function(types, i){
    var nodes = types.map(function(t){ return {type:t}; });
    if(i > 0 && i < 8 && rnd() < 0.5) nodes.reverse();
    return nodes;
  });
}

  d.style.left = (r.left + r.width/2) + 'px';
  d.style.top = (r.top + r.height*0.3) + 'px';
  document.getElementById('fx').appendChild(d);
  setTimeout(function(){ d.remove(); }, 780);
}
function shakeEnemy(){
  if(SIM) return;

}

/* ================= 交互 ================= */
function enterNode(row, idx){
  var node = G.run.map[row][idx];
  G.nodeRow = row;
  if(node.type === 'battle'){ startBattle('battle', row); G.screen = 'battle'; }
  else if(node.type === 'elite'){ startBattle('elite', row); G.screen = 'battle'; }
  else if(node.type === 'boss'){ startBattle('boss', row); G.screen = 'battle'; }
  else if(node.type === 'shop'){
    var cards = rollReward(), prices = cards.map(function(id){
      var r = CARDS[id].rarity;
      return r === 'rare' ? 95 : (r === 'uncommon' ? 70 : 45);
    });
    G.shop = {cards:cards, prices:prices};
    G.screen = 'shop';
  }
  else if(node.type === 'rest'){ G.screen = 'rest'; }
  else if(node.type === 'event'){ G.ev = pick(EVENTS)(); G.screen = 'event'; }
  render();
}
function leaveNode(){
  G.run.row++;
  G.b = null; G.shop = null; G.ev = null;
  G.screen = 'map';
  render();
}
function finishBattle(){
  if(G.b && G.b.row === 8){ G.screen = 'win'; render(); return; }
  var row = G.b ? G.b.row : 0;
  G.reward = null;
  if(!G.run.path && row >= 1){ G.b = null; G.screen = 'awaken'; render(); return; }
  leaveNode();
}

document.getElementById('app').addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]');
  if(!el) return;
  var act = el.dataset.act;

  if(act === 'start'){
    if(readSave() && !confirm('已有进行中的远征，重新开始会覆盖它。继续吗？')) return;
    newRun(); bumpStats({runs:1}); render(); return;
  }
  if(act === 'continue'){
    var sv = readSave();
    if(sv){ restoreSave(sv); render(); } else { toast('没有找到存档'); render(); }
    return;
  }
  if(act === 'again'){ G.screen = 'title'; render(); return; }

  if(act === 'node'){ enterNode(+el.dataset.x, +el.dataset.y); return; }

  if(act === 'path'){
    var pid = el.dataset.id;
    if(!PATHS[pid]) return;
    G.run.path = pid;
    addRelic(PATHS[pid].relic);
    if(pid === 'blood'){ G.run.maxHp += 12; G.run.hp += 12; }
    toast('流派已选定：' + PATHS[pid].name);
    leaveNode();
    return;
  }
  if(act === 'relic'){ G.rv = el.dataset.id; render(); return; }
  if(act === 'closerelic'){ G.rv = null; render(); return; }

  if(act === 'play'){
    if(!G.b) return;
    playCard(+el.dataset.i);
    return;
  }
  if(act === 'end'){
    if(!G.b || G.b.state !== 'player') return;
    endPlayerTurn();
    if(G.b && G.b.state === 'won'){ render(); return; }
    render();
    return;
  }

  if(act === 'take'){
    var id = G.reward.cards[+el.dataset.i];
    G.run.deck.push(id);
    toast('加入卡组：' + CARDS[id].name);
    finishBattle();
    return;
  }
  if(act === 'skipcard'){ toast('跳过选牌'); finishBattle(); return; }

  if(act === 'buy'){
    var i = +el.dataset.i, s = G.shop;
    var price = s.prices[i];
    if(G.run.gold < price){ toast('金币不够'); return; }
    G.run.gold -= price;
    G.run.deck.push(s.cards[i]);
    toast('买下：' + CARDS[s.cards[i]].name);
    s.cards.splice(i,1); s.prices.splice(i,1);
    render();
    return;
  }
  if(act === 'remove'){
    if(G.run.gold < 75){ toast('金币不够'); return; }
    G.removeFrom = 'shop'; G.screen = 'remove'; render(); return;
  }
  if(act === 'heal'){
    if(G.run.gold < 40){ toast('金币不够'); return; }
    G.run.gold -= 40;
    G.run.hp = Math.min(G.run.maxHp, G.run.hp + 25);
    toast('回复 25 生命');
    render();
    return;
  }
  if(act === 'leave'){ leaveNode(); return; }

  if(act === 'restheal'){
    var h = Math.ceil(G.run.maxHp * 0.3);
    G.run.hp = Math.min(G.run.maxHp, G.run.hp + h);
    toast('回复 ' + h + ' 生命');
    leaveNode();
    return;
  }
  if(act === 'restremove'){ G.removeFrom = 'rest'; G.screen = 'remove'; render(); return; }

  if(act === 'removepick'){
    var rid = el.dataset.id;
    var k = G.run.deck.indexOf(rid);
    if(k >= 0) G.run.deck.splice(k,1);
    toast('移除了：' + CARDS[rid].name);
    if(G.removeFrom === 'shop') G.run.gold -= 75;
    G.removeFrom = null;
    if(G.shop){ G.screen = 'shop'; render(); }
    else { leaveNode(); }
    return;
  }
  if(act === 'cancelremove'){
    G.removeFrom = null;
    G.screen = G.shop ? 'shop' : 'rest';
    render();
    return;
  }

  if(act === 'deck'){ G.screen = 'deck'; render(); return; }
  if(act === 'backmap'){ G.screen = 'map'; render(); return; }

  if(act === 'ev'){
    var e = G.ev, opt = e.opts[+el.dataset.i];
    var ok = opt.eff();
    if(ok !== false){ leaveNode(); }
    else { render(); }
    return;
  }
});

/* ================= 自测 ================= */
function botStep(){
  var b = G.b;
  if(!b || b.state !== 'player') return;
  var playable = [];
  for(var i=0;i<b.hand.length;i++){
    if(CARDS[b.hand[i]].cost <= b.energy) playable.push(i);
  }
  if(!playable.length){ endPlayerTurn(); return; }
  var idx = playable[ri(playable.length)];
  var id = b.hand[idx];
  var c = CARDS[id];
  b.energy -= c.cost;
  b.hand.splice(idx,1);
  if(c.exhaust){ if(!b.exhaust) b.exhaust=[]; b.exhaust.push(id); }
  else b.discard.push(id);
  b.playedThisTurn = (b.playedThisTurn||0) + 1;
  c.play();
  checkPhase();
  checkEnd();
}

function botStepSmart(){
  var b = G.b;
  if(!b || b.state !== 'player') return;
  var e = b.enemy, p = b.player;
  var it = e.pat[e.pi % e.pat.length];
  var incoming = it.k === 'atk' ? Math.round(it.v * e.dmgScale) * (it.hits || 1) : 0;
  incoming = Math.max(0, incoming + e.strength - p.block);

  function costOk(id){ return CARDS[id].cost <= b.energy; }
  function first(pred){
    for(var i=0;i<b.hand.length;i++){ if(costOk(b.hand[i]) && pred(CARDS[b.hand[i]], b.hand[i])) return i; }
    return -1;
  }
  var idx = -1;
  // 先上能力牌（越早滚雪球越强）
  if(b.turn <= 2) idx = first(function(c){ return c.type === 'power'; });
  // 挡不住的伤害先垫格挡
  if(idx < 0 && incoming > p.hp * 0.45) idx = first(function(c){ return c.type === 'skill' && /格挡/.test(c.desc); });
  // 过牌引擎
  if(idx < 0) idx = first(function(c){ return c.cost === 0 && /抽/.test(c.desc); });
  // 输出
  if(idx < 0) idx = first(function(c){ return c.type === 'attack'; });
  if(idx < 0) idx = first(function(c){ return c.type === 'skill' && /格挡/.test(c.desc); });
  if(idx < 0) idx = first(function(){ return true; });
  if(idx < 0){ endPlayerTurn(); return; }
  var id = b.hand[idx], c = CARDS[id];
  b.energy -= c.cost;
  b.hand.splice(idx,1);
  if(c.exhaust){ if(!b.exhaust) b.exhaust=[]; b.exhaust.push(id); }
  else b.discard.push(id);
  b.playedThisTurn = (b.playedThisTurn||0) + 1;
  c.play();
  checkPhase();
  checkEnd();
}

function simOne(seed, pathId, smart, acc){
  newRun(seed);
  for(var row=0; row<9; row++){
    if(!G.run.path && row >= 2){
      var want = pathId === 'random' ? pick(['draw','blood','block','poison']) : pathId;
      G.run.path = want;
      addRelic(PATHS[want].relic);
    }
    var role = row === 8 ? 'boss' : ((row === 2 || row === 5) ? 'elite' : 'battle');
    startBattle(role, row);
    acc.battles++;
    var guard = 0;
    while(G.b.state === 'player' && guard++ < 900){
      if(smart) botStepSmart(); else botStep();
    }
    if(guard >= 900) throw new Error('battle did not terminate at row ' + row);
    if(G.b.state !== 'won'){ return false; }
    acc.battles = acc.battles;
    acc.winsByRow[row] = (acc.winsByRow[row]||0)+1;
    if(G.reward && G.reward.cards.length){
      var pool = G.reward.cards;
      var mine = G.run.path ? pool.filter(function(x){ return CARDS[x].path === G.run.path; }) : [];
      G.run.deck.push(mine.length ? pick(mine) : pick(pool));
    }
    if(row === 3 || row === 6) G.run.hp = Math.min(G.run.maxHp, G.run.hp + 12);
  }
  return true;
}

function selftest(){
  SIM = true;
  var mode = /paths/.test(location.search) ? 'paths' : (/smart/.test(location.search) ? 'smart' : 'random');
  var res = {mode:mode, runs:0, wins:0, battles:0, errors:[], byPath:{}, byBoss:{}, deck:0};
  var groups = mode === 'paths' ? ['draw','blood','block','poison'] : ['random'];
  var smart = /smart/.test(location.search);
  for(var g=0; g<groups.length; g++){
    var pid = groups[g];
    var acc = {runs:0, wins:0, battles:0, deaths:0, winsByRow:{}, byBoss:{}};
    for(var s=0; s<150; s++){
      try{
        if(simOne(7000 + s + g*311, pid, smart, acc)) acc.wins++;
        else acc.deaths++;
      }catch(e){
        res.errors.push(String((e && e.stack) || e));
      }
      acc.runs++;
    }
    res.byPath[pid] = {runs:acc.runs, clear:acc.wins, battlewins:acc.battles, winrate:Math.round(acc.wins/acc.runs*1000)/10, winsByRow:acc.winsByRow};
    res.runs += acc.runs; res.wins += acc.wins; res.battles += acc.battles;
  }
  res.deck = G.run ? G.run.deck.length : 0;
  document.body.innerHTML = '<pre id="selftest">' + JSON.stringify(res, null, 2) + '</pre>';
}

/* ================= 启动 ================= */
if(/[?&]selftest/.test(location.search)){
  selftest();
} else {
  render();
}
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
window.__FROG__ = {G:G, CARDS:CARDS, RELICS:RELICS, PATHS:PATHS, newRun:newRun, startBattle:startBattle, render:render, enterNode:enterNode, checkPhase:checkPhase, addRelic:addRelic, readSave:readSave, restoreSave:restoreSave, clearSave:clearSave, readStats:readStats};
})();
